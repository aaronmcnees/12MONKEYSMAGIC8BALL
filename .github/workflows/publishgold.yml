name: Publish GOLD 13.31

on:
  push:
    branches: [main]
    paths:
      - 'GITHUBPUBLISH.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify publish bundle
        shell: bash
        run: |
          test -f GITHUBPUBLISH.zip
          echo 'd43e1a4ce5d2874a882c9e0e12e5a537fba6d02d4bbbc9dd55f25cb77b6eca81  GITHUBPUBLISH.zip' | sha256sum -c -
          rm -rf /tmp/magic8publish
          mkdir -p /tmp/magic8publish
          unzip -q GITHUBPUBLISH.zip -d /tmp/magic8publish
          echo '03be7e16e1e7ba3a4f514ae187c5df702c40964353a3cde6a484349a89142c25  /tmp/magic8publish/12MONKEYSMAGIC8BALL-gold.zip' | sha256sum -c -

      - name: Install exact GOLD contents and screenshots
        shell: bash
        run: |
          unzip -o /tmp/magic8publish/12MONKEYSMAGIC8BALL-gold.zip -d .
          chmod +x RUN.sh
          mkdir -p screenshots
          cp -a /tmp/magic8publish/screenshots/. screenshots/
          rm GITHUBPUBLISH.zip
          rm -f .github/workflows/publishgold.yml

      - name: Commit final GOLD repository
        shell: bash
        run: |
          git config user.name 'AETHER CAT'
          git config user.email '48531995+aaronmcnees@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish 12 MONKEYS MAGIC 8-BALL GOLD 13.31'
            git push origin main
          fi

      - name: Publish GitHub release 13.31
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          GOLD='/tmp/magic8publish/12MONKEYSMAGIC8BALL-gold.zip'
          if gh release view 13.31 >/dev/null 2>&1; then
            gh release upload 13.31 "$GOLD" /tmp/magic8publish/screenshots/*.png --clobber
          else
            gh release create 13.31 "$GOLD" /tmp/magic8publish/screenshots/*.png \
              --target main \
              --title '12 MONKEYS MAGIC 8-BALL 13.31' \
              --notes 'GOLD release of 12 MONKEYS MAGIC 8-BALL WORDLIST DELIMINATOR · VERSION 13.31 · AETHERCAT / COYOTELABS · 2026'
          fi
